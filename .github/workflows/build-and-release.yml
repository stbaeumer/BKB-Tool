name: Build and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Create scripts directory if not exists
      shell: pwsh
      run: |
        if (-not (Test-Path "scripts")) {
          New-Item -ItemType Directory -Path "scripts"
        }
    
    - name: Create increment-version script
      shell: pwsh
      run: |
        $scriptContent = @'
        param(
            [string]$projectPath = "BKB-Tool/BKB-Tool.csproj"
        )
        
        Write-Host "Incrementing version in $projectPath" -ForegroundColor Cyan
        
        # Projektdatei einlesen
        $csprojContent = Get-Content $projectPath -Raw
        
        # Aktuelle Version extrahieren
        if ($csprojContent -match '<Version>([\d\.]+)</Version>') {
            $currentVersion = $matches[1]
            Write-Host "Current version: $currentVersion" -ForegroundColor Yellow
            
            # Version in Teile zerlegen
            $versionParts = $currentVersion.Split('.')
            $major = [int]$versionParts[0]
            $minor = [int]$versionParts[1]
            $build = [int]$versionParts[2]
            
            # Build-Nummer erhöhen
            $build++
            
            $newVersion = "$major.$minor.$build"
            Write-Host "New version: $newVersion" -ForegroundColor Green
            
            # Alle Version-Tags aktualisieren
            $csprojContent = $csprojContent -replace '<Version>[\d\.]+</Version>', "<Version>$newVersion</Version>"
            $csprojContent = $csprojContent -replace '<AssemblyVersion>[\d\.]+</AssemblyVersion>', "<AssemblyVersion>$newVersion</AssemblyVersion>"
            $csprojContent = $csprojContent -replace '<FileVersion>[\d\.]+</FileVersion>', "<FileVersion>$newVersion</FileVersion>"
            
            # Datei speichern
            $csprojContent | Set-Content $projectPath -NoNewline
            
            Write-Host "Version successfully updated!" -ForegroundColor Green
            
            # Version für GitHub Actions ausgeben
            Write-Output "NEW_VERSION=$newVersion" >> $env:GITHUB_OUTPUT
            Write-Output "CURRENT_VERSION=$currentVersion" >> $env:GITHUB_OUTPUT
        } else {
            Write-Host "Error: Could not find version tag in project file" -ForegroundColor Red
            exit 1
        }
        '@
        
        $scriptContent | Out-File -FilePath "scripts/increment-version.ps1" -Encoding UTF8
    
    - name: Increment version
      id: version
      shell: pwsh
      run: |
        & "scripts/increment-version.ps1"
    
    - name: Get version
      id: get_version
      shell: pwsh
      run: |
        $content = Get-Content BKB-Tool/BKB-Tool.csproj -Raw
        if ($content -match '<Version>([\d\.]+)</Version>') {
          $version = $matches[1]
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"
        }
    
    - name: Get commit message
      id: commit_msg
      shell: pwsh
      run: |
        $msg = git log -1 --pretty=%B
        if ($msg -match "\[skip ci\]" -or $msg -match "chore: bump version") {
          $msg = git log -2 --pretty=%B --skip=1 | Select-Object -First 1
        }
        Write-Output "message=$msg" >> $env:GITHUB_OUTPUT
        Write-Host "Commit message: $msg"
    
    - name: Commit version bump
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add BKB-Tool/BKB-Tool.csproj
        git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.get_version.outputs.version }} [skip ci]"
        git push || echo "No changes to push"
    
    - name: Restore dependencies
      run: dotnet restore BKB-Tool/BKB-Tool.csproj
    
    - name: Build Windows x64
      run: |
        dotnet publish BKB-Tool/BKB-Tool.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:PublishTrimmed=false `
          -o ./publish/windows
    
    - name: Build Linux x64
      run: |
        dotnet publish BKB-Tool/BKB-Tool.csproj `
          -c Release `
          -r linux-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:PublishTrimmed=false `
          -o ./publish/linux

    - name: Prepare Linux Binary for Release
      shell: pwsh
      run: |
        # Kopiert die nackte Binärdatei mit einem eindeutigen Namen für das Release
        Copy-Item "./publish/linux/BKB-Tool" -Destination "./publish/linux/BKB-Tool-linux-x64"

    - name: Create AppImage structure
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "AppDir/usr/bin"
        New-Item -ItemType Directory -Force -Path "AppDir/usr/share/applications"
        Copy-Item "./publish/linux/BKB-Tool" -Destination "AppDir/usr/bin/"
        if (Test-Path "BKB-Tool/Icons/BKB-Tool_256.png") {
          Copy-Item "BKB-Tool/Icons/BKB-Tool_256.png" -Destination "AppDir/bkb-tool.png"
        }
        $desktopContent = "[Desktop Entry]`nType=Application`nName=BKB-Tool`nComment=Ein Werkzeug an der Schnittstelle zwischen SchILD und Webuntis`nExec=BKB-Tool`nIcon=bkb-tool`nCategories=Utility;`nTerminal=true`nVersion=1.0`n"
        $utf8NoBom = New-Object System.Text.UTF8Encoding $false
        [System.IO.File]::WriteAllText("AppDir/bkb-tool.desktop", $desktopContent, $utf8NoBom)
        Copy-Item "AppDir/bkb-tool.desktop" -Destination "AppDir/usr/share/applications/"
        $apprunContent = "#!/bin/bash`nSELF=`$(readlink -f `"`$0`")`nHERE=`${SELF%/*}`nexport PATH=`"`${HERE}/usr/bin:`${PATH}`"`nexport LD_LIBRARY_PATH=`"`${HERE}/usr/lib:`${LD_LIBRARY_PATH}`"`necho -ne `"\033]0;BKB-Tool\007`"`nexec `"`${HERE}/usr/bin/BKB-Tool`" `"`$@`"`n"
        [System.IO.File]::WriteAllText("AppDir/AppRun", $apprunContent, $utf8NoBom)
    
    - name: Install WSL
      uses: Vampire/setup-wsl@v3
      with:
        distribution: Ubuntu-22.04
    
    - name: Build AppImage
      shell: wsl-bash {0}
      run: |
        chmod +x AppDir/AppRun
        chmod +x AppDir/usr/bin/BKB-Tool
        sed -i 's/\r$//' AppDir/bkb-tool.desktop || true
        sed -i 's/\r$//' AppDir/AppRun || true
        wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
        chmod +x appimagetool
        ./appimagetool --appimage-extract
        export VERSION=${{ steps.get_version.outputs.version }}
        ARCH=x86_64 ./squashfs-root/AppRun --no-appstream \
          -u "gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|${{ steps.get_version.outputs.version }}|BKB-Tool.AppImage.zsync" \
          AppDir BKB-Tool-${{ steps.get_version.outputs.version }}.AppImage
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: Version ${{ steps.get_version.outputs.version }}
        body: |
          **Version ${{ steps.get_version.outputs.version }}** (Beta)
          
          ${{ steps.commit_msg.outputs.message }}
          
          ---
          
          **Assets - Downloads:**
          - `BKB-Tool.exe` - Windows x64
          - `BKB-Tool.AppImage` - Linux x64 (Bundle)
          - `BKB-Tool-linux-x64` - Linux x64 (Standalone Binary)
          - `BKB-Tool.AppImage.zsync` - für Linux-AppImage-Updates
        draft: false
        prerelease: true
        files: |
          ./publish/windows/BKB-Tool.exe
          ./publish/linux/BKB-Tool-linux-x64
          ./BKB-Tool-${{ steps.get_version.outputs.version }}.AppImage
          ./BKB-Tool.AppImage.zsync
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
